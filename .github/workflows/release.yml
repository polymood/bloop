name: release

# Push a tag like v0.2.0 to build the binaries and publish a GitHub release.
# Run it by hand to test the build without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # static binary, runs on any Linux distribution and in WSL
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # cpal needs ALSA on Linux, and Ubuntu has no ALSA library for musl: build a static one
      - if: contains(matrix.target, 'musl')
        run: |
          curl -sSfL https://www.alsa-project.org/files/pub/lib/alsa-lib-1.2.14.tar.bz2 | tar xj
          cd alsa-lib-1.2.14
          # musl has no kernel headers, take the system ones
          CC=musl-gcc CFLAGS="-O2 -idirafter /usr/include -idirafter /usr/include/x86_64-linux-gnu" \
            ./configure --prefix="$HOME/alsa" --enable-static --disable-shared --disable-python
          make -j"$(nproc)" install
          echo "PKG_CONFIG_PATH=$HOME/alsa/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name="bloop-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/bloop" README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: "*.tar.gz"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum *.tar.gz > SHA256SUMS
      - run: >
          gh release create "$GITHUB_REF_NAME" *.tar.gz SHA256SUMS
          --repo "$GITHUB_REPOSITORY" --title "bloop $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
