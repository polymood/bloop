name: ci

# Build, lint and test each push and pull request, before a release finds a broken build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
