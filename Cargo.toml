[package]
name = "bloop"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "A tiny web radio player for the terminal"
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cpal = "0.18.2"
dirs = "7.0.0"
fdk-aac = "0.8.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico", "bmp"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
rustfft = "6.4.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "ogg", "vorbis", "flac"] }
ureq = { version = "3.5.0", features = ["json"] }
webpki-roots = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

# WSL and most desktops have a PulseAudio server (or PipeWire's) but no ALSA device
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }
